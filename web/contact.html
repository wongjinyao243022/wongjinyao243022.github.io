<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us </title>
</head>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/contact.css">

<body>
    <section class="contact-info">
        <div class="card">
            <div class="card-image">
                <img src="images/office.png" alt="Office Location" />
                <h5>Office Location</h5>
            </div>
            <p class="smalltext">
                123 Jalan Main St, KL 58200, Malaysia
            </p>
        </div>
        <div class="card">
            <div class="card-image">
                <img src="images/email.png" alt="Email Our Team" />
                <h5>Email Our Team</h5>
            </div>
            <p class="smalltext">
                contactavada-company.com
            </p>
        </div>

        <div class="card">
            <div class="card-image">
                <img src="images/clock.png" alt="Working Hours" />
                <h5>Working Hours</h5>
            </div>
            <p class="smalltext">
                Monday to Friday : 9am-5pm
            </p>
        </div>
    </section>
</body>

</html>
